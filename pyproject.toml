[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicexp"
version = "0.2.0"
description = "Open-source experimentation and evaluation platform for public benefits and digital public services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Devdipta Pal" }]
keywords = [
    "experimentation",
    "ab-testing",
    "civic-technology",
    "public-benefits",
    "govtech",
    "causal-inference",
    "evidence-based-policy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
]

# No runtime dependencies. Agencies frequently cannot add third-party
# packages to a reviewed environment without a separate approval process,
# and every dependency is also supply-chain risk carried by every agency
# that deploys this. The statistical functions are implemented on the
# standard library for that reason.
dependencies = []

[project.optional-dependencies]
# Only needed to read configurations written as YAML. JSON configurations
# work with no third-party package at all.
yaml = ["PyYAML>=6.0"]
dev = ["PyYAML>=6.0", "pytest>=7.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/devdiptapal/civic-experimentation-platform"
Documentation = "https://github.com/devdiptapal/civic-experimentation-platform#readme"
Issues = "https://github.com/devdiptapal/civic-experimentation-platform/issues"
Changelog = "https://github.com/devdiptapal/civic-experimentation-platform/blob/main/CHANGELOG.md"

[project.scripts]
civicexp = "civicexp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 95
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # long lines are mostly prose in docstrings
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
